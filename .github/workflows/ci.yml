name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Version
        run: go version

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Run Race Detector Tests
        run: go test -race ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Binary
        run: go build -v .

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Version
        run: go version

      - name: Run Windows Unit Tests
        run: go test ./...

      - name: Run Windows Go Vet
        run: go vet ./...

      - name: Build Windows Binary
        run: go build -v .
