name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cfst-go/go.mod

      - name: Go Version
        working-directory: cfst-go
        run: go version

      - name: Run Unit Tests
        working-directory: cfst-go
        run: go test -v ./...

      - name: Run Race Detector Tests
        working-directory: cfst-go
        run: go test -race ./...

      - name: Run Go Vet
        working-directory: cfst-go
        run: go vet ./...

  build-and-release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cfst-go/go.mod

      - name: Go Version
        working-directory: cfst-go
        run: go version

      - name: Run Windows Unit Tests
        working-directory: cfst-go
        run: go test ./...

      - name: Run Windows Go Vet
        working-directory: cfst-go
        run: go vet ./...

      - name: Build Windows x64 Binary
        working-directory: cfst-go
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist
          go build -ldflags="-s -w" -o ..\dist\CFST-windows-amd64.exe .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CFST v2.1.7
          body: |
            Final concurrency safety fix on top of v2.1.6.
            - Fixed RouteStore.SaveSnapshot real concurrent data race via deep-copy under RLock
            - Fixed ProbeScheduler/DiscoveryManager ctx-cancel restart lifecycle race via generation guard
            - Added real concurrency tests (snapshot vs probe, ctx-cancel restart)
            - Windows 11 x64 release only
          files: dist/CFST-windows-amd64.exe
          generate_release_notes: false
