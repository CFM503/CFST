name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Version
        run: go version

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Run Race Detector Tests
        run: go test -race ./...

      - name: Run Go Vet
        run: go vet ./...

  build-and-release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Version
        run: go version

      - name: Run Windows Unit Tests
        run: go test ./...

      - name: Run Windows Go Vet
        run: go vet ./...

      - name: Build Windows x64 Binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist
          go build -ldflags="-s -w" -o dist\CFST-windows-amd64.exe .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CFST v2.3.0
          body: |
            CFST v2.3.0: Single-File Architecture & Anti-403 Fast-Converging Route Optimizer Release.
            - Consolidated entire codebase into a standalone single-file `main.go` with embedded Base64 Web UI assets
            - Strict Anti-403 WAF gate: rejected HTTP >= 400 and < 200 nodes from candidate pools
            - Dedicated SNI website probing with decoupled Cloudflare official speed test normalization
            - Fast-converging scan parameters (Unique C-subnets, 3-ping pre-filter, 30~45s execution)
            - Incorporated TLS + HTTP TTFB into composite latency scoring
            - Unified Web UI probing pipeline with Profile architecture
            - Windows 11 x64 release only
          files: dist/CFST-windows-amd64.exe
          generate_release_notes: false
