name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cfst-go/go.mod

      - name: Build binaries
        working-directory: cfst-go
        run: |
          mkdir -p ../dist
          GOOS=windows GOARCH=386 go build -ldflags="-s -w" -o ../dist/cfst_windows_386.exe .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/cfst_windows_amd64.exe .
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/cfst_linux_amd64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/cfst_darwin_amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/cfst_darwin_arm64 .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
